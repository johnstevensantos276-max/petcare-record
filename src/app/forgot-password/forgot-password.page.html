<ion-content [fullscreen]="true">
  <div class="login-page">

    <!-- Floating paws in the background -->
    <div class="bg-paws" aria-hidden="true">
      <span><ion-icon name="paw"></ion-icon></span><span><ion-icon name="paw"></ion-icon></span><span><ion-icon name="paw"></ion-icon></span><span><ion-icon name="paw"></ion-icon></span><span><ion-icon name="paw"></ion-icon></span>
    </div>

    <!-- Brand -->
    <header class="hero hero-compact">
      <div class="logo">
        <span class="logo-ring"></span>
        <ion-icon class="logo-paw" name="key-outline"></ion-icon>
      </div>
      <h1>Forgot Password</h1>
      <p>We'll help you get back into your account.</p>
    </header>

    <div class="card-enter">
    <img class="card-pets" src="assets/images/pets-hero.svg" alt="" aria-hidden="true">

    <!-- Email + Recovery Code + new password -->
    <form
      *ngIf="step === 'reset'"
      class="login-card"
      [class.shake]="shake"
      (animationend)="onShakeEnd($event)"
      (ngSubmit)="resetPassword()">

      <h2>Reset your password</h2>
      <p class="subtitle">Use the 4-number Recovery PIN you chose when you made your account.</p>

      <label class="field" style="--i: 0">
        <span class="field-label">Email, username or mobile number</span>
        <span class="input-wrap">
          <ion-icon class="input-icon" name="mail-outline"></ion-icon>
          <input
            name="email"
            type="text"
            autocomplete="email"
            autocapitalize="off"
            placeholder="What you use to log in"
            [(ngModel)]="email"
            (input)="clearError()"
            [disabled]="loading">
        </span>
      </label>

      <label class="field" style="--i: 1">
        <span class="field-label">Recovery PIN (4 numbers)</span>
        <span class="input-wrap">
          <ion-icon class="input-icon" name="keypad-outline"></ion-icon>
          <input
            name="pin"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            maxlength="4"
            placeholder="Used if you forget your password"
            [(ngModel)]="pin"
            (input)="clearError()"
            [disabled]="loading">
        </span>
      </label>

      <label class="field" style="--i: 2">
        <span class="field-label">New Password</span>
        <span class="input-wrap">
          <ion-icon class="input-icon" name="lock-closed-outline"></ion-icon>
          <input
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="new-password"
            placeholder="6+ characters, letters and numbers"
            [(ngModel)]="password"
            (input)="clearError()"
            [disabled]="loading">
          <button
            type="button"
            class="toggle-password"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </span>
      </label>

      <label class="field" style="--i: 3">
        <span class="field-label">Confirm New Password</span>
        <span class="input-wrap">
          <ion-icon class="input-icon" name="lock-closed-outline"></ion-icon>
          <input
            name="confirmPassword"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="new-password"
            placeholder="Re-enter your new password"
            [(ngModel)]="confirmPassword"
            (input)="clearError()"
            [disabled]="loading">
        </span>
      </label>

      <p class="error" *ngIf="errorMessage" role="alert">
        <ion-icon name="alert-circle-outline"></ion-icon> {{ errorMessage }}
      </p>

      <button
        type="submit"
        class="login-button"
        style="--i: 4"
        [class.is-loading]="loading"
        [disabled]="loading">
        <span class="spinner" *ngIf="loading"></span>
        <span>{{ loading ? 'Saving...' : 'Reset Password' }}</span>
      </button>

      <p class="register-link" style="--i: 5">
        Remembered it?
        <a routerLink="/login">Back to Login</a>
      </p>
    </form>

    <!-- Done: show the new Recovery Code -->
    <div *ngIf="step === 'done'" class="login-card done-card">
      <div class="done-icon"><ion-icon name="checkmark-circle"></ion-icon></div>
      <h2>Password changed!</h2>
      <p class="subtitle">You can now log in with your new password.</p>

      <button type="button" class="login-button" (click)="goToLogin()">
        Back to Login
      </button>
    </div>
    </div>

  </div>
</ion-content>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="JRR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d7a92"/>
      <stop offset="0.55" stop-color="#4f8fa8"/>
      <stop offset="1" stop-color="#8cc7d6"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Letters J R R, drawn as strokes so they look the same everywhere -->
  <g transform="translate(-6 10)" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 170 H150 V282 A30 30 0 0 1 90 282"/>
    <path d="M208 322 V170 H253 A38 38 0 0 1 253 246 H208 M248 246 L288 322"/>
    <path d="M350 322 V170 H395 A38 38 0 0 1 395 246 H350 M390 246 L430 322"/>
  </g>

  <!-- Small paw under the letters -->
  <g fill="#ffffff" fill-opacity="0.9" transform="translate(256 404)">
    <ellipse cx="0" cy="8" rx="17" ry="14"/>
    <ellipse cx="-20" cy="-12" rx="7" ry="9"/>
    <ellipse cx="-7" cy="-22" rx="7" ry="9"/>
    <ellipse cx="7" cy="-22" rx="7" ry="9"/>
    <ellipse cx="20" cy="-12" rx="7" ry="9"/>
  </g>
</svg>
